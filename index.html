<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name | Profile</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Your Name</h1>
    <nav class="bar">
      <span class="bar-name">Your Name</span>
      <ul class="bar-links">
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="about">
      <img src="images/me.jpg" alt="Portrait photo of Your Name" class="photo">
      <div class="cards">
        <article class="card">
          <h2>Skills</h2>
          <p>HTML, CSS, and JavaScript basics.</p>
        </article>
        <article class="card">
          <h2>Hobbies</h2>
          <p>Reading, football, and gaming.</p>
        </article>
        <article class="card">
          <h2>Goals</h2>
          <p>Become a great web developer.</p>
        </article>
      </div>
    </section>

    <section id="contact">
      <h2>Leave your details</h2>
      <form>
        <label for="name">Name</label>
        <input type="text" id="name" name="name">

        <label for="email">Email</label>
        <input type="email" id="email" name="email">
      </form>
    </section>

    <button id="theme-btn" type="button">Toggle dark mode</button>
  </main>

  <footer>
    <p>&copy; 2026 Your Name. All rights reserved.</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
